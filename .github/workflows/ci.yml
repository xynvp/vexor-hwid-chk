name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run check
      - name: Build frontends and Worker
        run: npm run build
      - name: Worker and D1 tests
        run: npm test
      - name: Rust tests
        run: cargo test --workspace --locked
